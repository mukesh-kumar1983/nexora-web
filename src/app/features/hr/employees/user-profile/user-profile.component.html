<!--<small class="dirty-text" *ngIf="isFormDirty()">
  You have unsaved changes
</small>-->

<div class="profile-wrapper">

  <!-- =====================================================
       LEFT PROFILE CARD
  ====================================================== -->
  <div class="profile-card">

    <!-- PROFILE IMAGE (ALWAYS EDITABLE) -->
    <div class="avatar-wrapper" (click)="fileInput.click()">

      <img class="avatar" [src]="profileImageUrl" />

      <!-- Upload hint overlay -->
      <div class="avatar-overlay">
        <i class="bi bi-camera-fill"></i>
        <span>Change Photo</span>
      </div>

    </div>

    <!-- Hidden file input -->
    <input type="file"
           #fileInput
           hidden
           accept="image/*"
           (change)="onFileSelected($event)" />

    <!-- USER INFO -->
    <h2>{{ form.value.firstName }} {{ form.value.lastName }}</h2>

    <p class="subtitle">
      {{ form.value.city }} {{ form.value.country }}
    </p>

  </div>

  <!-- =====================================================
       RIGHT FORM CARD
  ====================================================== -->
  <div class="form-card">

    <app-page-header title="Employee List"></app-page-header>
    

    <form [formGroup]="form">

      <!-- NAME ROW -->
      <div class="row">

        <div class="col-md-6 col-sm-12">
          <div class="floating-group">
            <label>First Name</label>
            <input formControlName="firstName" />

            <small class="error" *ngIf="isInvalid('firstName')">
              First name is required
            </small>
          </div>
        </div>

        <div class="col-md-6 col-sm-12">
          <div class="floating-group">
            <label>Last Name</label>
            <input formControlName="lastName" />

            <small class="error" *ngIf="isInvalid('lastName')">
              Last name is required
            </small>
          </div>
        </div>

      </div>

      <!-- EMAIL (READ ONLY - AUTH IDENTITY FIELD) -->
      <div class="row">
        <div class="col-md-6 col-sm-12">
          <div class="floating-group">
            <label>Email</label>
            <input formControlName="email" />
          </div>
        </div>
        <div class="col-md-6 col-sm-12">
          <div class="floating-group">
            <label>Phone Number</label>
            <input formControlName="phoneNumber" />

            <small class="error" *ngIf="isInvalid('phoneNumber')">
              Phone number is required
            </small>
          </div>
        </div>
      </div>

      <!-- GENDER -->
      <div class="row">
        <div class="col-12">
          <div class="floating-group">
            <label>Gender</label>
            <select formControlName="gender">
              <option value="">Select Gender</option>
              <option value="Male">Male</option>
              <option value="Female">Female</option>
              <option value="Other">Other</option>
            </select>
          </div>
        </div>
      </div>

      <!-- ADDRESS -->
      <div class="row">
        <div class="col-12">
          <div class="floating-group">
            <label>Address</label>
            <textarea formControlName="address" rows="2"></textarea>

            <small class="error" *ngIf="isInvalid('address')">
              Address is required
            </small>
          </div>
        </div>
      </div>

      <!-- CITY + COUNTRY -->
      <div class="row">

        <div class="col-md-6 col-sm-12">
          <div class="floating-group">
            <label>City</label>
            <input formControlName="city" />

            <small class="error" *ngIf="isInvalid('city')">
              City is required
            </small>
          </div>
        </div>

        <div class="col-md-6 col-sm-12">
          <div class="floating-group">
            <label>Country</label>
            <input formControlName="country" />

            <small class="error" *ngIf="isInvalid('country')">
              Country is required
            </small>
          </div>
        </div>

      </div>

      <!-- JOB + DEPARTMENT -->
      <div class="row">

        <div class="col-md-6 col-sm-12">
          <div class="floating-group">
            <label>Job Title</label>
            <select formControlName="jobTitleId"
                    [disabled]="!(roles.includes('Admin') || roles.includes('HR'))">
              <option value="">Select Job Title</option>
              <option *ngFor="let job of jobTitles" [value]="job.id">
                {{ job.title }}
              </option>
            </select>
          </div>
        </div>

        <div class="col-md-6 col-sm-12">
          <div class="floating-group">
            <label>Department</label>
            <select formControlName="departmentId">
              <option value="">Select Department</option>
              <option *ngFor="let dept of departments" [value]="dept.id">
                {{ dept.title }}
              </option>
            </select>
          </div>
        </div>

      </div>

      <!-- SAVE BUTTON -->
      <div class="row">
        <div class="col-12">
          <button class="save-btn"
                  type="button"
                  (click)="save()"
                  >

            Save Changes
          </button>
        </div>
      </div>

    </form>
  </div>
</div>
