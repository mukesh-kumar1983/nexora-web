<div class="container-fluid">

  <!-- Welcome Section -->
  <div class="row mb-4">
    <div class="col">
      <div class="p-4 bg-white rounded shadow-sm">
        <h3>Welcome to Nexora Dashboard 👋</h3>
        <p class="text-muted">
          Manage HR, Products, Orders and Payments from one place.
        </p>
      </div>
    </div>
  </div>

  <!-- Stats Cards -->
  <div class="row">

    <div class="col-md-3 mb-3" *ngFor="let item of stats">

      <div class="card shadow-sm h-100">

        <div class="card-body d-flex justify-content-between align-items-center">

          <div>
            <h6 class="text-muted">{{ item.title }}</h6>
            <h3>{{ item.value }}</h3>
          </div>

          <i class="bi {{ item.icon }}" style="font-size: 2rem;"></i>

        </div>

      </div>

    </div>

  </div>

</div>
