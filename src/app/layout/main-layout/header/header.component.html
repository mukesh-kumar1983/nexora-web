<nav (click)="menuOpen = false" class="navbar navbar-dark bg-dark px-3 d-flex justify-content-between">

  <!-- LEFT -->
  <span class="navbar-brand mb-0 h1">Nexora</span>

  <!-- RIGHT -->
  <div class="user-section" (click)="$event.stopPropagation()" *ngIf="userProfile$ | async as user">

    <!-- Username -->
    <span class="user-name">
      {{ user.fullName }}
    </span>

    <!-- Avatar button -->
    <button class="avatar-btn" (click)="toggleMenu()">
      <img
        class="profile-avatar"
        [src]="user.profileImageUrl || 'https://ui-avatars.com/api/?name=' + user.fullName"
        alt="Profile"
      />
    </button>

    <!-- Dropdown -->
    <div class="profile-dropdown" *ngIf="menuOpen">

      <div class="dropdown-header">
        <div class="name">{{ user.fullName }}</div>
        <div class="email">{{ user.email }}</div>
      </div>

      <div class="divider"></div>

      <a routerLink="/hr/employees/my-profile" (click)="closeMenu()">
        <i-lucide name="user"></i-lucide>
        My Profile
      </a>

      <a *ngIf="canManageEmployees(user)" routerLink="/employees/new" (click)="closeMenu()">
        <i-lucide name="user-plus"></i-lucide>
        Add Employee
      </a>

      <a routerLink="/change-password" (click)="closeMenu()">
        <i-lucide name="key"></i-lucide>
        Change Password
      </a>

      <div class="divider"></div>

      <a class="logout" (click)="logout()">
        <i-lucide name="log-out"></i-lucide>
        Logout
      </a>

    </div>
  </div>
</nav>
